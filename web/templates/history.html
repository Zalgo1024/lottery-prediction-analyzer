{% extends "base.html" %}
{% block content %}
<h2><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4V3h6v1"/><path d="M9 9h6M9 13h6M9 17h6"/></svg> 历史记录</h2>
<div style="margin:15px 0">
  <button class="btn btn-info btn-sm" onclick="loadHistory(1)">今天</button>
  <button class="btn btn-info btn-sm" onclick="loadHistory(7)">最近 7 天</button>
  <button class="btn btn-info btn-sm" onclick="loadHistory(30)">最近 30 天</button>
  <button class="btn btn-info btn-sm" onclick="loadHistory(365)">全部</button>
</div>
<div id="history-result"><div class="alert alert-info">选择时间范围加载历史记录</div></div>
<script>document.addEventListener('DOMContentLoaded', () => loadHistory(7));</script>
{% endblock %}
