{% extends "base.html" %}
{% block content %}
<h2><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></svg> 滚动预测训练</h2>
<p style="color:var(--gray);margin-bottom:15px">用前 N 期数据预测下一期，滚动评估各策略真实命中表现（反馈闭环第 1 阶段）</p>
<div class="grid-2">
  <div class="card">
    <h3>参数设置</h3>
    <div class="form-group">
      <label>彩票类型</label>
      <select id="roll-lottery"><option>双色球</option><option>大乐透</option><option>排列5</option><option>福彩3D</option><option>排列3</option><option>七星彩</option></select>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>训练窗口（期）</label>
        <input id="roll-window" type="number" value="50" min="10" max="500">
      </div>
      <div class="form-group">
        <label>评估期数</label>
        <input id="roll-eval-periods" type="number" value="100" min="10" max="1000">
      </div>
    </div>
    <button id="roll-start" class="btn btn-primary" onclick="startRolling()"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3c3 2 5 6 5 10l-3 3H10l-3-3c0-4 2-8 5-10z"/><circle cx="12" cy="9" r="1.5"/><path d="M9 19l-2 2M15 19l2 2"/></svg> 开始滚动训练</button>

    <div id="roll-progress" class="hidden" style="margin-top:15px">
      <div id="roll-progress-text">启动中...</div>
      <div class="progress-bar"><div id="roll-progress-fill" class="fill" style="width:0%"></div></div>
    </div>
  </div>

  <div>
    <div id="roll-result" class="hidden">
      <div class="card">
        <h3>滚动训练结果</h3>
        <div id="roll-result-content"></div>
      </div>
    </div>
    <div class="card">
      <h3>说明</h3>
      <ul style="font-size:13px;color:var(--gray);line-height:1.8;padding-left:20px">
        <li>每期用 3 种策略分别预测（高频/遗漏/区间均衡）</li>
        <li>与真实开奖对比，统计各策略平均命中与中奖率</li>
        <li>评估结果为反馈闭环提供策略权重调整依据</li>
        <li>运行时间较长（约 100 期 × 3 策略），异步执行不阻塞页面</li>
      </ul>
    </div>
  </div>
</div>
{% endblock %}
