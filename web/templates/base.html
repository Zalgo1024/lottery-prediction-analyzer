<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>彩票预测分析系统</title>
    <!-- 内联 favicon：此前浏览器请求 /favicon.ico 一律 404，控制台每次都留一条红字 -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='10' cy='16' r='6' fill='%23ef4444'/%3E%3Ccircle cx='22' cy='16' r='6' fill='%232563eb'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="/static/css/style.css?v={{ asset_ver('css/style.css') }}">
</head>
<body>

<!-- 顶部导航：条目来自 web/nav.py（与左侧栏同一份清单，加页面只改一处） -->
<div class="navbar">
    <div class="brand" title="双色球 · 大乐透 · 排列5 · 福彩3D · 排列3 · 七星彩"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-4px;margin-right:6px"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg> Lottery Analyzer</div>
    <nav>
        {% for it in nav_flat %}<a href="{{ it.href }}"{% if it.note %} title="{{ it.note }}"{% endif %}{% if it.danger %} style="color:#ff8a80"{% endif %}>{{ it.label }}</a>
        {% endfor %}
        <button id="btn-restart" class="nav-restart" onclick="restartService()" title="加载磁盘上的最新代码并重启 Web 服务（约 1~2 秒）">
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg> 重启服务
        </button>
        <span id="sys-status-badge" class="sys-status-badge" title="当前服务进程实时信息"></span>
    </nav>
</div>

<!-- 侧栏：分组渲染，与顶栏同源 -->
<div class="sidebar">
    {% for grp in nav_groups %}
    <div class="section-title">{{ grp.title }}</div>
    {% for it in grp["items"] %}<a href="{{ it.href }}"{% if it.danger %} style="color:#c0392b"{% endif %}{% if it.note %} title="{{ it.note }}"{% endif %}><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px;margin-right:6px">{{ it.icon | safe }}</svg>{{ it.side }}</a>
    {% endfor %}
    {% endfor %}
</div>

<!-- 主内容 -->
<div class="main">
    <div id="alert-container"></div>
    {% block content %}{% endblock %}
</div>

<!-- 模态框 -->
<div id="modal" class="hidden" style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:999;display:flex;align-items:center;justify-content:center">
    <div style="background:white;border-radius:8px;max-width:900px;max-height:85vh;overflow:auto;margin:20px;padding:25px;position:relative">
        <button onclick="closeModal()" style="position:absolute;top:10px;right:15px;border:none;background:none;font-size:24px;cursor:pointer">&times;</button>
        <div id="modal-body"></div>
    </div>
</div>

<script src="/static/js/main.js?v={{ asset_ver('js/main.js') }}"></script>
</body>
</html>
