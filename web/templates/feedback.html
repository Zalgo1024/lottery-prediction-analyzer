{% extends "base.html" %}
{% block content %}
<h2><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></svg> 反馈闭环</h2>
<p style="color:var(--gray);margin-bottom:15px">预测 → 开奖 → 对比命中 → 更新策略权重 → 优化下次预测</p>

<div style="margin:15px 0;display:flex;gap:10px;flex-wrap:wrap;align-items:center">
  <select id="fb-lottery" style="padding:8px 15px;border:1px solid #ddd;border-radius:5px;font-size:14px" onchange="_onFbLotteryChange()">
    <option value="全部彩种" selected>全部彩种（全部 6 种）</option>
    <option value="双色球">仅双色球</option>
    <option value="大乐透">仅大乐透</option>
    <option value="排列5">仅排列5</option>
    <option value="福彩3D">仅福彩3D</option>
    <option value="排列3">仅排列3</option>
    <option value="七星彩">仅七星彩</option>
  </select>
  <select id="fb-lookback" style="padding:8px 15px;border:1px solid #ddd;border-radius:5px;font-size:14px">
    <option value="0" selected>全部历史</option>
    <option value="20">近 20 期</option>
    <option value="50">近 50 期</option>
    <option value="100">近 100 期</option>
  </select>
  <select id="fb-source" style="padding:8px 15px;border:1px solid #ddd;border-radius:5px;font-size:14px">
    <option value="all" selected>全部来源</option>
    <option value="predict">日常预测</option>
    <option value="训练">训练生成</option>
  </select>
  <button class="btn btn-primary" onclick="loadFeedbackSummary()"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg> 刷新摘要</button>
  <button class="btn btn-info" onclick="loadFeedbackCompare()"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg> 对比视图</button>
  <button class="btn btn-warning" onclick="evaluatePending()">触发评估</button>
</div>

<div style="margin:10px 0 20px;padding:12px 14px;border:1px solid var(--color-border-secondary,#e5e7eb);border-radius:8px;background:var(--color-background-secondary,#f9fafb);display:flex;gap:10px;flex-wrap:wrap;align-items:center">
  <span style="font-size:13px;color:var(--gray);font-weight:600;white-space:nowrap">历史命中筛选：</span>
  <select id="fb-min-prize" onchange="_refreshFeedbackHistoryIfVisible()" style="padding:8px 12px;border:1px solid #ddd;border-radius:5px;font-size:14px" title="按中奖等级过滤">
    <option value="全部" selected>全部等级</option>
    <option value="一等">一等奖及以上</option>
    <option value="二等">二等奖及以上</option>
    <option value="三等">三等奖及以上</option>
    <option value="四等">四等奖及以上</option>
    <option value="五等">五等奖及以上</option>
    <option value="六等">六等奖及以上</option>
    <option value="七等">七等奖及以上（大乐透）</option>
    <option value="八等">八等奖及以上（大乐透）</option>
    <option value="九等">九等奖（大乐透）</option>
    <option value="直选">直选（数字型）</option>
    <option value="组选3">组选3（数字型）</option>
    <option value="组选6">组选6（数字型）</option>
  </select>
  <select id="fb-red-hits" onchange="_refreshFeedbackHistoryIfVisible()" style="padding:8px 12px;border:1px solid #ddd;border-radius:5px;font-size:14px" title="仅对双色球/大乐透生效">
    <option value="" selected>红球命中 ≥ 0</option>
    <option value="1">红球命中 ≥ 1</option>
    <option value="2">红球命中 ≥ 2</option>
    <option value="3">红球命中 ≥ 3</option>
    <option value="4">红球命中 ≥ 4</option>
    <option value="5">红球命中 ≥ 5</option>
    <option value="6">红球命中 ≥ 6</option>
  </select>
  <select id="fb-blue-hits" onchange="_refreshFeedbackHistoryIfVisible()" style="padding:8px 12px;border:1px solid #ddd;border-radius:5px;font-size:14px" title="仅对双色球/大乐透生效">
    <option value="" selected>蓝球命中 ≥ 0</option>
    <option value="1">蓝球命中 ≥ 1</option>
    <option value="2">蓝球命中 ≥ 2</option>
  </select>
  <select id="fb-total-hits" onchange="_refreshFeedbackHistoryIfVisible()" style="padding:8px 12px;border:1px solid #ddd;border-radius:5px;font-size:14px;display:none" title="对数字型彩种生效">
    <option value="" selected>总命中 ≥ 0</option>
    <option value="1">总命中 ≥ 1</option>
    <option value="2">总命中 ≥ 2</option>
    <option value="3">总命中 ≥ 3</option>
    <option value="4">总命中 ≥ 4</option>
    <option value="5">总命中 ≥ 5</option>
    <option value="6">总命中 ≥ 6</option>
    <option value="7">总命中 ≥ 7</option>
  </select>
  <select id="fb-limit" onchange="_refreshFeedbackHistoryIfVisible()" style="padding:8px 12px;border:1px solid #ddd;border-radius:5px;font-size:14px" title="查询上限，防止数据过多">
    <option value="5">5 条</option>
    <option value="10">10 条</option>
    <option value="20">20 条</option>
    <option value="50">50 条</option>
    <option value="100" selected>100 条</option>
    <option value="200">200 条</option>
    <option value="500">500 条</option>
    <option value="0">全部</option>
  </select>
  <select id="fb-sort" onchange="_refreshFeedbackHistoryIfVisible()" style="padding:8px 12px;border:1px solid #ddd;border-radius:5px;font-size:14px">
    <option value="time" data-order="desc" selected>时间（新→旧）</option>
    <option value="time" data-order="asc">时间（旧→新）</option>
    <option value="prize" data-order="asc">中奖等级（高→低）</option>
    <option value="total_hits" data-order="desc">总命中（高→低）</option>
    <option value="red_hits" data-order="desc">红球命中（高→低）</option>
    <option value="blue_hits" data-order="desc">蓝球命中（高→低）</option>
  </select>
</div>

<div id="fb-summary"><div class="alert alert-info">点击「刷新摘要」查看反馈数据</div></div>

<div id="fb-detail" class="hidden" style="margin-top:20px"></div>

<div id="fb-compare" class="hidden" style="margin-top:20px"></div>

{% endblock %}
