[pytest]
# 用例分布在两处：tests/（主套件）+ scripts/（数据契约自检，9 例）。
# 显式声明 testpaths，避免在仓库根裸跑时误收集到工具产物目录。
testpaths = tests scripts
python_files = test_*.py

# --strict-markers 不是洁癖，是防静默失效：
# 不加这条时，@pytest.mark.slow 误拼成 @pytest.mark.slwo 只会在报告里留一行
# warning，测试照样跑；等你用 -m "not slow" 时，那些本该被跳过的重活
# 一个都不会被跳过，而你以为自己跑的是快集。
#
# 这里**不放 -q**：scripts/sync_counts.py 靠 `--collect-only -q` 的
# "N tests collected" 行取真源；addopts 里再叠一个 -q 就变成 -qq，
# 输出退化成逐文件计数、拿不到总数 —— 计数脚本会静默失效。
addopts = --strict-markers

markers =
    slow: 单次耗时较长（全量数据扫描 / 蒙特卡洛 / 多彩种流水线）。日常改一行代码时用 `-m "not slow"` 跳过，提交前跑全量
    network: 需要访问外网（抓取源 / GitHub API）。离线或沙箱环境应跳过
    realdata: 需要本地研究数据或生成物（market/market.db、training/hypotheses 登记册）。CI / 全新克隆 / 无数据环境由 conftest 自动跳过，本机全量照跑。★ 跳过理由逐项点名缺什么
    statsmodels: 需要可选科学计算栈 statsmodels（流行度 GLM / 销量模型 / walk-forward β）。不在 requirements 里，装了才跑
    winfont: 需要 Windows 中文字体（Microsoft YaHei / SimHei / SimSun）—— matplotlib 缺字形警告类用例。Linux/macOS 自动跳过
